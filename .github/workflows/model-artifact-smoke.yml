name: Model artifact smoke check

on:
  push:
    branches:
      - main
      - 'feature/*'
    paths:
      - 'api.py'
      - 'app_helpers.py'
      - 'requirements.txt'
      - 'requirements-api.txt'
      - 'resume_job_ml_model.pkl'
      - 'job_catalog.csv'
      - '.github/workflows/model-artifact-smoke.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'api.py'
      - 'app_helpers.py'
      - 'requirements.txt'
      - 'requirements-api.txt'
      - 'resume_job_ml_model.pkl'
      - 'job_catalog.csv'
      - '.github/workflows/model-artifact-smoke.yml'

permissions:
  contents: read

jobs:
  model-artifact-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install artifact smoke dependencies
        run: python -m pip install pandas numpy scikit-learn==1.6.1 joblib
      - name: Load saved model and catalog
        run: |
          python - <<'PY'
          import joblib
          import numpy as np
          import pandas as pd

          artifacts = joblib.load("resume_job_ml_model.pkl")
          assert {"model", "vectorizer"} <= set(artifacts)
          vectorizer = artifacts["vectorizer"]
          assert vectorizer.transform(["Python and data analysis"]).shape[0] == 1
          prediction = float(artifacts["model"].predict(np.zeros((1, 5)))[0])
          assert np.isfinite(prediction)

          catalog = pd.read_csv("job_catalog.csv")
          required = {"job_id", "category", "job_title", "job_description", "job_skill_set"}
          assert required <= set(catalog.columns)
          assert not catalog.empty
          print(f"Model artifact smoke passed; catalog rows: {len(catalog)}")
          PY

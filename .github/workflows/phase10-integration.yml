name: Phase 10 integration validation

on:
  push:
    branches:
      - integration/phase10-roadmap-mainline

permissions:
  contents: read

jobs:
  roadmap-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run roadmap helper tests
        run: python -m unittest discover -s tests -p "test_app_helpers.py" -v
